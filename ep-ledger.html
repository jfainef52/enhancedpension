<style>
:root {
  --navy:#0d1b2e; --navy-2:#152640; --navy-3:#1e3558;
  --gold:#c9a84c; --gold-lt:#dfc278; --gold-pale:#f7f0e0;

  --red:#8b2020; --red-lt:#fdf0f0; --text:#1a1a2a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',sans-serif;background:#e8e4dc;color:var(--text);font-size:14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:17in;min-height:11in;margin:0 auto 32px;overflow:hidden;position:relative;background:white;box-shadow:0 8px 40px rgba(0,0,0,.18);display:flex;flex-direction:column}
@page{size:17in 11in landscape;margin:.35in}
@media print{
  body{background:white}
  .page{margin:0;box-shadow:none;page-break-after:always;min-height:0!important}
  .page:last-child{page-break-after:avoid!important}
  .disc-3col{margin-top:16px!important}
  table.dual tbody tr,table.sc-ldg tbody tr{page-break-inside:avoid}

}
.actions-bar{background:var(--navy-2);padding:10px 24px;display:flex;gap:12px;align-items:center;border-bottom:1px solid rgba(201,168,76,.2)}
.ab-btn{border:1px solid rgba(201,168,76,.3);color:var(--gold);background:transparent;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:7px 16px;border-radius:3px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;transition:all .2s}
.ab-btn:hover{border-color:var(--gold);background:rgba(201,168,76,.1)}
.ab-btn.primary{background:var(--gold);color:var(--navy);font-weight:600;border-color:var(--gold)}
@media print{.actions-bar{display:none!important}}

/* DB toggle control */
.db-ctrl{display:flex;align-items:center;gap:10px;padding-left:16px;border-left:1px solid rgba(201,168,76,.25)}
.db-switch{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.65);font-family:'IBM Plex Sans',sans-serif;user-select:none}
.db-switch input{accent-color:#c9a84c;width:14px;height:14px;cursor:pointer}
.db-file-label{border:1px dashed rgba(201,168,76,.4);color:var(--gold);background:transparent;font-size:9.5px;letter-spacing:.5px;padding:6px 12px;border-radius:3px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;transition:all .15s;white-space:nowrap}
.db-file-label:hover{background:rgba(201,168,76,.1)}
.db-file-label.disabled{opacity:.35;pointer-events:none}

.db-rate-input{border:1px solid rgba(201,168,76,.4);background:rgba(255,255,255,.04);color:var(--gold);font-size:10px;padding:6px 10px;border-radius:3px;font-family:'IBM Plex Mono',monospace;width:150px;outline:none}
.db-rate-input::placeholder{color:rgba(201,168,76,.4)}
.db-rate-input.disabled{opacity:.35;pointer-events:none}
.db-status{font-size:9.5px;color:rgba(255,255,255,.4);font-family:'IBM Plex Sans',sans-serif;max-width:260px}
.db-status.err{color:#e08080}

/* ── PAGE HEADER (greensheet dual-panel pages) ── */
.eta-page-hdr{background:var(--navy);padding:16px 32px;display:flex;align-items:flex-start;justify-content:space-between;width:100%;box-sizing:border-box}
.eta-page-hdr .eyebrow{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.eta-page-hdr .title{font-family:'Playfair Display',serif;font-size:26px;color:var(--white);font-weight:500}
.eta-page-hdr .meta-line{font-size:10px;color:rgba(255,255,255,.45);margin-top:4px;letter-spacing:.3px}
.eta-page-hdr .ver-block{text-align:right}
.eta-page-hdr .ver-block .vdate{font-size:10px;color:rgba(255,255,255,.35);margin-top:2px}

/* Stat strip */
.stat-strip{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:2px solid var(--border)}
.stat-box{padding:10px 18px;border-right:1px solid var(--border)}
.stat-box:last-child{border-right:none}
.stat-box .sb-label{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;line-height:1.4}
.stat-box .sb-val{font-family:'Playfair Display',serif;font-size:20px;color:var(--navy);font-weight:600}
.stat-box .sb-sub{font-size:9px;color:var(--muted);margin-top:3px}
.stat-box.hl{background:rgba(201,168,76,.05)}
.stat-box.hl .sb-val{color:var(--gold)}
.stat-box .sb-adv{font-size:10px;color:var(--green);font-weight:600;margin-top:4px}

/* Two-panel table */
.dual-panel{width:100%;overflow:hidden;box-sizing:border-box}
.dual-panel>div:first-child{float:left;width:42%;box-sizing:border-box}
.right-panel-wrap{float:left!important;width:58%;box-sizing:border-box;border-left:none}
.dual-panel.db-mode>div:first-child{width:58%}
.dual-panel.db-mode>.right-panel-wrap{width:42%}
/* Force both panels' header rows to the same height regardless of how much
   their (very differently-shaped) column sets wrap, so every data row below
   lines up between the two tables. */
.dual-panel.db-mode table.dual thead tr:first-child th{height:26px;box-sizing:border-box;vertical-align:middle}
.dual-panel.db-mode table.dual thead tr:last-child th{height:30px;box-sizing:border-box;vertical-align:middle}

table.dual tfoot td{padding:5px 6px;text-align:center;font-weight:700;border-top:2px solid var(--navy);font-size:9.5px;background:var(--off)}
table.dual tbody tr.totals-row td{padding:5px 6px;text-align:center;font-weight:700;border-top:2px solid var(--navy);font-size:9.5px;background:var(--off)}
.right-panel-wrap table.dual td:first-child,.right-panel-wrap table.dual th:first-child{border-left:3px solid var(--gold)}
.disc-3col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;padding:8px 32px;border-top:1px solid var(--border);font-size:8px;color:var(--muted);line-height:1.5}

/* PAGE 2+: Scenario analysis / ledger header */
.pg2-hdr{background:var(--navy);padding:16px 32px;display:flex;align-items:center;justify-content:space-between}
.pg2-hdr .title{font-family:'Playfair Display',serif;font-size:20px;color:var(--white)}
.pg2-hdr .sub{font-size:10px;color:rgba(255,255,255,.4);margin-top:3px}

/* Scenario cards */
.scenario-strip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border-bottom:1px solid var(--border)}
.sc-band{padding:16px 20px;border-right:1px solid var(--border)}
.sc-band:last-child{border-right:none}
.sc-band.median{background:rgba(201,168,76,.04);border-top:3px solid var(--gold)}
.sc-band .sc-name{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.sc-band.median .sc-name{color:var(--gold)}
.sc-band .sc-inc{font-family:'Playfair Display',serif;font-size:26px;color:var(--navy)}
.sc-band .sc-sub{font-size:10px;color:var(--muted);margin-top:4px}
.sc-band .sc-total{font-size:11px;color:var(--text);font-weight:600;margin-top:6px}

/* Scenario ledger table */

table.sc-ldg thead th{background:var(--navy);color:rgba(255,255,255,.55);font-size:7.5px;letter-spacing:.6px;text-transform:uppercase;padding:4px 6px;text-align:center;border-right:1px solid rgba(255,255,255,.06)}
table.sc-ldg thead th.gold-col{background:rgba(201,168,76,.15);color:var(--gold)}
table.sc-ldg tbody td{padding:3px 6px;text-align:center;border-bottom:1px solid #f0ede6;border-right:1px solid #f0ede6;font-size:9px}
table.sc-ldg tbody td:first-child,table.sc-ldg tbody td:nth-child(2){font-weight:500}
table.sc-ldg tbody tr:nth-child(even){background:var(--off)}
table.sc-ldg tbody tr.income-yr td.gold-col{color:var(--gold);font-weight:700}
table.sc-ldg tbody tr.income-yr td.green-col{color:var(--green);font-weight:600}
table.sc-ldg tbody tr.sec-hdr td{background:var(--navy-2)!important;color:var(--gold);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;font-family:'IBM Plex Sans',sans-serif;padding:5px 6px;text-align:left!important;font-weight:600}
table.sc-ldg tfoot td{padding:5px 7px;text-align:right;font-weight:700;border-top:2px solid var(--navy);font-size:9.5px;background:var(--off)}

table.sc-ldg tfoot td.gold-col{color:var(--gold)}

<body>
<div class="actions-bar">
  <button class="ab-btn primary" onclick="window.print()">Print / Export PDF</button>
  <div class="db-ctrl">
    <label class="db-switch">
      <input type="checkbox" id="dbToggle" onchange="onDBToggle()"/>
      Death Benefit Focused Output
    </label>
    <label class="db-file-label disabled" id="dbFileLabel" for="dbFileInput">Upload Carrier File (CSV/XLSX)</label>
    <input type="file" id="dbFileInput" accept=".csv,.xlsx,.xls" style="display:none" onchange="onDBFileChosen(event)"/>
    <input type="text" id="dbRateInput" class="db-rate-input disabled" placeholder="Stated rate, e.g. 6.25%" disabled oninput="onDBRateInput()"/>
    <span class="db-status" id="dbStatus"></span>
  </div>
  <span style="margin-left:auto;color:rgba(255,255,255,.3);font-size:10px;letter-spacing:1.5px;text-transform:uppercase">EFS Life LLC &middot; Internal Advisor Tool</span>
</div>
<div id="pages"></div>
<script>
function $f(n){ return '$'+Math.round(n||0).toLocaleString('en-US'); }
function fmtPct(n){ return (n||0).toFixed(2)+'%'; }

// Ported from ep-modeler.html — needed to recompute the lender rate per year
function getBankRateForYear(policyYr, indexBase, spread, rateEnv){
  const FLOOR = 4.0;
  let idx = indexBase;
  if (rateEnv==='level') { idx = indexBase; }
  else if (rateEnv==='easing'){
    if (policyYr<=1) idx=indexBase;
    else if (policyYr<=5) idx=Math.max(indexBase-(policyYr-1)*0.5, 1.5);
    else if (policyYr<=11) idx=Math.max(indexBase-4*0.5, 1.5);
    else idx=Math.min(indexBase-4*0.5+(policyYr-11)*0.12, indexBase);
  } else if (rateEnv==='tightening'){
    idx=Math.min(indexBase+(policyYr-1)*0.5, indexBase+2);
  }
  return Math.max(idx+spread, FLOOR);
}

// ══════════════════════════════════════════════════════════
// DEATH-BENEFIT-FOCUSED OUTPUT — carrier file parsers
// Ported verbatim from tef-pre-illus.html so a second, standalone carrier
// illustration (run at the carrier's stated/current gross assumed rate —
// NOT the Monte Carlo engine) can be uploaded here to drive a Gross
// Accumulated Value / CSV Net of Loans / DB Net of Loans view. This is a
// deliberately separate data source from the bootstrapped income ledger
// above: the income ledger answers "what income can this produce," this
// answers "what does the death benefit look like if income is never
// drawn," off the carrier's own stated numbers.
// ══════════════════════════════════════════════════════════
function parseNLGCSV_DB(text) {
  const allLines = text.replace(/\r/g, '').split('\n');
  const hIdx = allLines.findIndex(l => {
    const lower = l.toLowerCase();
    return (lower.includes('policy year') || lower.includes('"year"') || lower.match(/^"?year"?,/))
           && lower.includes('age');
  });
  if (hIdx < 0) return null;
  const headers = allLines[hIdx].split(',').map(h => h.replace(/"/g,'').trim().toLowerCase());
  const col = (...names) => {
    for (const name of names) {
      const idx = headers.findIndex(h => h === name || h.includes(name));
      if (idx >= 0) return idx;
    }
    return -1;
  };
  const yearIdx = col('policy year', 'year');
  const ageIdx  = col('age');
  const avIdx   = col('accumulated value');
  const csvIdx  = col('cash surrender value', 'surrender value');
  const dbIdx   = col('net death benefit', 'death benefit');
  if (yearIdx < 0 || avIdx < 0) return null;

  const rows = [];
  for (let i = hIdx + 1; i < allLines.length; i++) {
    const line = allLines[i].trim();
    if (!line) continue;
    const parts = line.split(',').map(v => v.replace(/"/g,'').trim());
    const yr = parseInt(parts[yearIdx]);
    if (isNaN(yr) || yr < 1) continue;
    rows.push({
      year: yr,
      age:  parseInt(parts[ageIdx]) || 0,
      av:   avIdx  >= 0 ? parseFloat(parts[avIdx])  || 0 : 0,
      csv:  csvIdx >= 0 ? parseFloat(parts[csvIdx]) || 0 : 0,
      db:   dbIdx  >= 0 ? parseFloat(parts[dbIdx])  || 0 : 0,
    });
  }
  return rows.length ? rows : null;
}

function sheetToGrid_DB(ws) {
  if (!ws || !ws['!ref']) return [];
  const range = XLSX.utils.decode_range(ws['!ref']);
  const grid = [];
  for (let r = range.s.r; r <= range.e.r; r++) {
    const row = [];
    for (let c = range.s.c; c <= range.e.c; c++) {
      const cell = ws[XLSX.utils.encode_cell({ r, c })];
      row.push(cell ? cell.v : null);
    }
    grid.push(row);
  }
  return grid;
}
function findSheetByName_DB(wb, ...candidates) {
  for (const name of candidates) {
    const lower = name.toLowerCase();
    let match = wb.SheetNames.find(sn => sn.trim().toLowerCase() === lower);
    if (!match) match = wb.SheetNames.find(sn => sn.trim().toLowerCase().includes(lower));
    if (match) return wb.Sheets[match];
  }
  return null;
}
function findYearAgeHeaderRow_DB(grid) {
  for (let i = 0; i < grid.length; i++) {
    const a = (grid[i][0] ?? '').toString().trim().toLowerCase();
    const b = (grid[i][1] ?? '').toString().trim().toLowerCase();
    if (a === 'year' && b === 'age') return i;
  }
  return -1;
}
function buildColumnHeaders_DB(grid, headerRowIdx, lookback = 6) {
  const start = Math.max(0, headerRowIdx - lookback);
  const numCols = grid[headerRowIdx].length;
  const headers = [];
  for (let c = 0; c < numCols; c++) {
    const parts = [];
    for (let r = start; r <= headerRowIdx; r++) {
      const v = grid[r] ? grid[r][c] : null;
      if (v !== null && v !== undefined) {
        const s = String(v).replace(/\u00a0/g, ' ').trim();
        if (s) parts.push(s);
      }
    }
    headers.push(parts.join(' ').toLowerCase());
  }
  return headers;
}
function parsePacificLifeXLSX_DB(arrayBuffer) {
  let wb;
  try { wb = XLSX.read(arrayBuffer, { type: 'array' }); } catch(e) { return null; }
  // Pacific Life's real export is the "Tabular Detail" sheet, not a simple
  // single-scale ledger: it lays out THREE scenario blocks side by side
  // (Guaranteed / Non-Guaranteed Alternate Scale / Non-Guaranteed), each
  // with its own Accumulated (gross) / Surrender (net) / Death trio, and the
  // Year/Age columns carry no header text at all (they're implicit). We want
  // the current-scale "Non-Guaranteed" block specifically — not "Alternate
  // Scale" — found by its title text rather than a fixed column letter, so
  // this still resolves correctly if a different run shifts the column count.
  const sheet = findSheetByName_DB(wb, 'Tabular Detail', 'Non-Guaranteed Ledger', 'Non-Guaranteed');
  if (!sheet) return null;
  const grid = sheetToGrid_DB(sheet);

  let blockStartCol = -1, blockTitleRow = -1;
  for (let r = 0; r < Math.min(grid.length, 15); r++) {
    for (let c = 0; c < grid[r].length; c++) {
      const v = (grid[r][c] || '').toString().trim().toLowerCase();
      if (v.includes('non-guaranteed') && v.includes('values') && !v.includes('alternate')) {
        blockStartCol = c; blockTitleRow = r;
      }
    }
  }
  if (blockStartCol < 0) return null;

  // The Accumulated/Surrender/Death sub-headers sit a few rows below the
  // block title. Search rightward from blockStartCol only, so a match in an
  // earlier (Guaranteed / Alternate Scale) block is never picked up.
  let labelRow = -1, avIdx = -1, csvIdx = -1, dbIdx = -1;
  for (let r = blockTitleRow; r < Math.min(grid.length, blockTitleRow + 8); r++) {
    for (let c = blockStartCol; c < grid[r].length; c++) {
      const v = (grid[r][c] || '').toString().trim().toLowerCase();
      if (v === 'accumulated' && avIdx < 0) { avIdx = c; labelRow = r; }
      else if (v === 'surrender' && csvIdx < 0) csvIdx = c;
      else if (v === 'death' && dbIdx < 0) dbIdx = c;
    }
    if (avIdx >= 0 && csvIdx >= 0 && dbIdx >= 0) break;
  }
  if (avIdx < 0 || csvIdx < 0 || dbIdx < 0) return null;

  // Data starts the row after the label row. Year/Age columns (0, 1) have
  // no header text — just take the first row where column 0 parses as a
  // policy year.
  const rows = [];
  for (let r = labelRow + 1; r < grid.length; r++) {
    const yr = parseInt(grid[r][0]);
    if (isNaN(yr) || yr < 1) continue;
    rows.push({
      year: yr, age: parseInt(grid[r][1]) || 0,
      av:  parseFloat(grid[r][avIdx])  || 0,
      csv: parseFloat(grid[r][csvIdx]) || 0,
      db:  parseFloat(grid[r][dbIdx])  || 0,
    });
  }
  return rows.length ? rows : null;
}
async function parseDBCarrierFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (ext === 'xls' || ext === 'xlsx') {
    if (typeof XLSX === 'undefined') throw new Error('Excel parser did not load — check your connection and try again.');
    const buf = await file.arrayBuffer();
    const rows = parsePacificLifeXLSX_DB(buf);
    if (!rows) throw new Error('Could not find Year/Age columns with Accumulated Value, Cash Surrender Value, and Death Benefit on the "Non-Guaranteed Ledger" sheet.');
    return rows;
  }
  const text = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => res(e.target.result);
    r.onerror = () => rej(new Error('File read failed'));
    r.readAsText(file);
  });
  const rows = parseNLGCSV_DB(text);
  if (!rows) throw new Error('Could not find Policy Year/Age/Accumulated Value columns in the CSV.');
  return rows;
}

let _dbCarrierRows = null;
let _dbEnabled = false;
let _dbAssumedRate = '';

function renderLedger(){
  try {
    const raw = localStorage.getItem('ep_ledger_data');
    if (!raw) {
      document.getElementById('pages').innerHTML = '<div style="padding:60px;text-align:center;font-family:IBM Plex Sans,sans-serif;color:#8a8070">No modeler run found. Run the Monte Carlo analysis in the EP Modeler first, then click "Produce EP Ledger."</div>';
      return;
    }
    const d = JSON.parse(raw);
    const dateStr = d.date || new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
    const showQP = d.compareMode === 'both';

    const pdaByYr = {};
    (d.pdaSchedule||[]).forEach(r=>pdaByYr[r.yr]=r);
    // PDA balance still un-deployed (not yet paid into the policy as premium) at a
    // given policy year — it's the client's own money, sitting outside the policy,
    // and at death it's available alongside the policy's own net value. Net figures
    // below add this back rather than treating the loan as the only offset.
    function pdaBalAtYr(polYr){ return Math.max(0, pdaByYr[polYr]?.eoy || 0); }

    // Pre-compute EP row derived fields (interest, lender rate, PDA balance, payoff flag)
    // for a given percentile's row array.
    function enrichEPRows(rows){
      let prevLoan = 0;
      return rows.map((r,i)=>{
        const interest = Math.max(0, r.loan - prevLoan - (r.financedTax||0) - (r.income||0));
        const isPayoff = r.polYr === d.refiYear;
        const lenderRate = r.polYr < d.refiYear ? getBankRateForYear(r.polYr, d.lenderIndex, d.lenderSpread, d.rateEnv) : null;
        const csvNetTotal = r.csvNet + pdaBalAtYr(r.polYr);
        prevLoan = r.loan;
        return {...r, interest, isPayoff, lenderRate, csvNetTotal};
      });
    }
    const epRows50 = enrichEPRows(d.epRows50);
    const epRows25 = enrichEPRows(d.epRows25);
    const epRows75 = enrichEPRows(d.epRows75);
    const epByAge50 = {}; epRows50.forEach(r=>epByAge50[r.age]=r);
    const epByAge25 = {}; epRows25.forEach(r=>epByAge25[r.age]=r);
    const epByAge75 = {}; epRows75.forEach(r=>epByAge75[r.age]=r);

    const ageRange = epRows50.map(r=>r.age);
    const totalPremium = (d.pdaSchedule||[]).reduce((s,r)=>s+r.premium,0);
    const isStandalone = d.compareMode === 'none';

    // ══════════════════════════════════════════════════════════
    // DEATH-BENEFIT-FOCUSED COLUMNS — bank-phase loan projection + netting
    // Mirrors tef-pre-illus.html's netting pattern exactly: EFS projects
    // the BANK loan ourselves (it's external to the policy, years 1 through
    // refiYear-1). From the refinance year forward, the loan lives on the
    // policy as a carrier policy loan — and the uploaded carrier file (run
    // by the advisor assuming no income is ever drawn) already reflects
    // that policy loan in its own CSV/DB figures. So nothing further is
    // subtracted from Policy Year refiYear onward; the carrier's numbers
    // are used as-is. Accumulated Value is always shown gross, throughout.
    // ══════════════════════════════════════════════════════════
    function computeBankPhaseLoanMap(){
      let loan = 0;
      const map = {};
      for (let polYr=1; polYr<d.refiYear; polYr++){
        const rate = getBankRateForYear(polYr, d.lenderIndex, d.lenderSpread, d.rateEnv)/100;
        const compI = polYr<=d.contribYears ? d.comp : 0;
        const financedTax = polYr<=d.contribYears ? compI*(d.taxRate/100) : 0;
        loan = (loan + financedTax) * (1+rate);
        map[polYr] = loan;
      }
      return map;
    }
    function buildDBColumnsByYear(carrierRows){
      if (!carrierRows || !carrierRows.length) return null;
      const loanMap = computeBankPhaseLoanMap();
      const byYear = {};
      carrierRows.forEach(r=>{
        const carrierAlreadyNet = r.year >= d.refiYear;
        const loanBal = carrierAlreadyNet ? 0 : (loanMap[r.year] || 0);
        const pdaBal = pdaBalAtYr(r.year);
        byYear[r.year] = {
          age: r.age || (d.issueAge + r.year - 1),
          av: r.av,
          csvNet: (r.csv - loanBal) + pdaBal,
          dbNet: Math.max(0, r.db - loanBal) + pdaBal,
          loanBal, pdaBal
        };
      });
      return byYear;
    }
    const dbByYear = (_dbEnabled && _dbCarrierRows) ? buildDBColumnsByYear(_dbCarrierRows) : null;

    // ══════════════════════════════════════════════════════════
    // STANDALONE PAGE — EP income only, no comparator (single panel)
    // ══════════════════════════════════════════════════════════
    function buildStandaloneIncomePage(){
      const incomeAges = ageRange.filter(a=>a>=d.incStart && a<=d.incEnd);
      const totalEPIncome = incomeAges.reduce((s,a)=>s+((epByAge50[a]||{}).income||0),0);
      const endEP = epByAge50[d.incEnd] || {};

      const statStrip = `
        <div class="stat-strip">
          <div class="stat-box">
            <div class="sb-label">Annual Compensation<br>Contributed</div>
            <div class="sb-val">${$f(d.comp)}</div>
            <div class="sb-sub">${d.contribYears} years</div>
          </div>
          <div class="stat-box">
            <div class="sb-label">Total EP Premium<br>Into Tax-Free Asset</div>
            <div class="sb-val">${$f(totalPremium)}</div>
            <div class="sb-sub">PDA-funded, bank-financed tax</div>
          </div>
          <div class="stat-box hl">
            <div class="sb-label">Total EP Income<br>Tax-Free Drawdowns</div>
            <div class="sb-val">${$f(totalEPIncome)}</div>
            <div class="sb-sub">Median (50th percentile)</div>
          </div>
          <div class="stat-box hl">
            <div class="sb-label">Net Asset Value at Age ${d.incEnd}<br>Net of All Loans</div>
            <div class="sb-val">${$f(endEP.csvNetTotal)}</div>
            <div class="sb-sub">Asset loan retires from death benefit</div>
          </div>
        </div>`;

      let rows='', prevSection='';
      ageRange.forEach(a=>{
        const yr = a - d.issueAge + 1;
        const isIncome = a>=d.incStart && a<=d.incEnd;
        const isFund = yr<=d.contribYears;
        const ep = epByAge50[a] || {};
        const isPayoff = ep.isPayoff;

        let secHdr='';
        if (yr===1 && prevSection!=='fund'){ secHdr = `ACCUMULATION PHASE \u2014 YEARS 1\u2013${d.incStart-d.issueAge} (NO DISTRIBUTIONS)`; prevSection='fund'; }
        if (isIncome && prevSection!=='income'){ secHdr = `DISTRIBUTION PHASE \u2014 YEARS ${d.incStart-d.issueAge+1}\u2013${d.incEnd-d.issueAge+1} (INCOME DISTRIBUTIONS BEGIN)`; prevSection='income'; }

        const rowCls = isPayoff ? 'payoff-yr' : isIncome ? 'income-yr' : isFund ? 'fund-yr' : 'post-yr';
        if (secHdr) rows += `<tr class="sec-hdr"><td colspan="13">${secHdr}</td></tr>`;

        const pdaRow = pdaByYr[yr];
        const pdaToAsset = (pdaRow && yr<=d.contribYears) ? $f(pdaRow.premium) : '\u2014';
        const pdaBal = (pdaRow && yr<=d.contribYears) ? $f(Math.max(0,pdaRow.eoy)) : '\u2014';
        const lenderRate = ep.lenderRate!=null ? fmtPct(ep.lenderRate) : '\u2014';
        const loanForTax = ep.financedTax>0 ? $f(ep.financedTax) : '\u2014';
        const interest = ep.interest>0 ? $f(ep.interest) : '\u2014';
        const loanBal = ep.loan!=null ? $f(ep.loan) : '\u2014';
        const loanPayoff = isPayoff ? $f(ep.loan) : '\u2014';
        const taxFreeInc = isIncome ? $f(ep.income) : '\u2014';

        rows += `<tr class="${rowCls}">
          <td>${yr}</td><td>${a}</td>
          <td>${isFund?$f(d.comp):'\u2014'}</td>
          <td>${pdaToAsset}</td>
          <td>${pdaBal}</td>
          <td>${lenderRate}</td>
          <td>${loanForTax}</td>
          <td>${interest}</td>
          <td>${loanBal}</td>
          <td>${isPayoff ? `<strong style="color:#c9a84c">${loanPayoff}</strong>` : loanPayoff}</td>
          <td class="${isIncome?'inc-val':''}">${taxFreeInc}</td>
          <td>${$f(ep.av)}</td>
          <td>${$f(ep.csvNetTotal)}</td>
        </tr>`;
      });

      const rightFoot = `<tr><td colspan="10" style="text-align:left">TOTALS \u2014 Tax-Free Income (Median)</td><td style="color:#c9a84c">${$f(totalEPIncome)}</td><td>\u2014</td><td>\u2014</td></tr>`;

      const disc = `<div class="disc-3col">
        <div>The hypothetical models in this summary assume certain crediting methods and index account charges that are purely hypothetical and do not represent any particular investment or product. Hypothetical crediting methods, charges, values and returns are not guaranteed. Hypothetical returns used in this summary are bootstrapped historical S&amp;P 500 returns (${d.dataYears}-yr pool) used purely as a hypothetical example of index volatility over a period of time.</div>
        <div>EFS Life LLC and its related entities' programs, strategies, solutions, and platforms are not intended to be investment advice or a recommendation of any stock or index. The Enhanced Pension structure and related benefits shown are hypothetical. The finance arrangement is offered by EFS Life LLC. All platforms, programs, solutions, media mediums, and collateral pieces are not valid unless accompanied by a complete illustration.</div>
        <div>The benefits and values shown are not guaranteed. The assumptions on which they are based are subject to change. Actual results may be more or less favorable. THIS IS A HYPOTHETICAL MODEL. REFER TO THE FULL ILLUSTRATION FOR DETAILS, CHARGES, GUARANTEES AND GUIDELINES. EnhancedPension.com \u00b7 EFS Life LLC${d.advisor?' \u00b7 '+d.advisor:''} \u00b7 ${dateStr}</div>
      </div>`;

      return `
        <div class="eta-page-hdr">
          <div>
            <div class="eyebrow">Enhanced Pension \u2014 EP \u00b7 Median Market Sequence \u00b7 Standalone Income Ledger</div>
            <div class="title">${d.clientName}</div>
            <div class="meta-line">Client: ${d.clientName} &nbsp;|&nbsp; Advisor: ${d.advisor||'\u2014'} &nbsp;|&nbsp; Annual Compensation: ${$f(d.comp)} &nbsp;|&nbsp; Combined Tax Rate: ${fmtPct(d.taxRate)} &nbsp;|&nbsp; PDA Rate: ${fmtPct(d.pdaRate)} &nbsp;|&nbsp; PLR: ${fmtPct(d.plr)}</div>
          </div>
          <div class="ver-block">
            <div class="vdate">${dateStr}</div>
            <div style="font-size:9px;color:rgba(255,255,255,.3);margin-top:2px">${d.nSims.toLocaleString()} simulations \u00b7 ${d.dataYears}-yr pool</div>
          </div>
        </div>
        ${statStrip}
        <div style="padding:0 32px">
          <table class="dual" style="width:100%">
            <colgroup><col style="width:3.5%"><col style="width:4.5%"><col style="width:7.7%"><col style="width:7.7%"><col style="width:7.7%"><col style="width:7.7%"><col style="width:7.7%"><col style="width:7.7%"><col style="width:7.7%"><col style="width:7.7%"><col style="width:11%"><col style="width:9.5%"><col style="width:9.8%"></colgroup>
            <thead>
              <tr><th colspan="13" style="background:var(--navy);color:var(--gold);font-size:9px;letter-spacing:2px;text-transform:uppercase;font-weight:600;text-align:left;padding:8px 12px;border-left:3px solid var(--gold)">Enhanced Pension \u2014 Median (50th Percentile)</th></tr>
              <tr>
                <th style="border-left:3px solid var(--gold)">Yr</th><th>Age</th>
                <th>Contrib \u2192 PDA</th><th>PDA \u2192 Asset</th><th>PDA Balance</th>
                <th>Lender Rate</th><th>Loan for Tax</th><th>Interest</th><th>Loan Balance</th>
                <th>Loan Payoff</th><th>Tax-Free Income</th><th>Asset Value</th><th>Net Asset Value</th>

        ${disc}`;
    }

    // ══════════════════════════════════════════════════════════
    // EP INCOME (left) vs DEATH BENEFIT FOCUSED (right) — dual panel
    // Two distinct data sources, kept visually separate so the different
    // assumptions behind each side are never confused: left is the
    // bootstrapped Monte Carlo median path; right is the carrier's own
    // stated/illustrated gross rate, entered by the advisor, assuming no
    // income is ever drawn.
    // ══════════════════════════════════════════════════════════
    function buildEPvsDBPage(){
      const incomeAges = ageRange.filter(a=>a>=d.incStart && a<=d.incEnd);
      const totalEPIncome = incomeAges.reduce((s,a)=>s+((epByAge50[a]||{}).income||0),0);
      const endEP = epByAge50[d.incEnd] || {};
      const maxDBYear = Math.max(...Object.keys(dbByYear).map(Number));
      const rateLabel = _dbAssumedRate ? _dbAssumedRate : 'not entered';

      // No single "Death Benefit at Age X" headline figure — a death benefit
      // is a one-time payout at whichever year death occurs, not a total to
      // be headlined the way lifetime income is, and pulling out just the
      // final row's number invites exactly that misreading. The full
      // year-by-year progression lives in the right panel table itself.
      const statStrip = `
        <div class="stat-strip" style="grid-template-columns:repeat(3,1fr)">
          <div class="stat-box">
            <div class="sb-label">Annual Compensation<br>Contributed</div>
            <div class="sb-val">${$f(d.comp)}</div>
            <div class="sb-sub">${d.contribYears} years</div>
          </div>
          <div class="stat-box">
            <div class="sb-label">Total EP Premium<br>Into Tax-Free Asset</div>
            <div class="sb-val">${$f(totalPremium)}</div>
            <div class="sb-sub">PDA-funded, bank-financed tax</div>
          </div>
          <div class="stat-box hl">
            <div class="sb-label">Total EP Income<br>Tax-Free Drawdowns (Median)</div>
            <div class="sb-val">${$f(totalEPIncome)}</div>
            <div class="sb-sub">Left panel \u2014 bootstrapped Monte Carlo</div>
          </div>
        </div>`;

      let leftRows='';
      ageRange.forEach(a=>{
        const yr = a - d.issueAge + 1;
        const isIncome = a>=d.incStart && a<=d.incEnd;
        const isFund = yr<=d.contribYears;
        const ep = epByAge50[a] || {};
        const isPayoff = ep.isPayoff;

        const rowCls = isPayoff ? 'payoff-yr' : isIncome ? 'income-yr' : isFund ? 'fund-yr' : 'post-yr';

        const pdaRow = pdaByYr[yr];
        const pdaToAsset = (pdaRow && yr<=d.contribYears) ? $f(pdaRow.premium) : '\u2014';
        const pdaBalCell = (pdaRow && yr<=d.contribYears) ? $f(Math.max(0,pdaRow.eoy)) : '\u2014';
        const lenderRate = ep.lenderRate!=null ? fmtPct(ep.lenderRate) : '\u2014';
        const loanForTax = ep.financedTax>0 ? $f(ep.financedTax) : '\u2014';
        const interest = ep.interest>0 ? $f(ep.interest) : '\u2014';
        const loanBal = ep.loan!=null ? $f(ep.loan) : '\u2014';
        const loanPayoff = isPayoff ? $f(ep.loan) : '\u2014';
        const taxFreeInc = isIncome ? $f(ep.income) : '\u2014';

        leftRows += `<tr class="${rowCls}">
          <td>${yr}</td><td>${a}</td>
          <td>${isFund?$f(d.comp):'\u2014'}</td>
          <td>${pdaToAsset}</td>
          <td>${pdaBalCell}</td>
          <td>${lenderRate}</td>
          <td>${loanForTax}</td>
          <td>${interest}</td>
          <td>${loanBal}</td>
          <td>${isPayoff ? `<strong style="color:#c9a84c">${loanPayoff}</strong>` : loanPayoff}</td>
          <td class="${isIncome?'inc-val':''}">${taxFreeInc}</td>
          <td>${$f(ep.av)}</td>
          <td>${$f(ep.csvNetTotal)}</td>
        </tr>`;
      });
      const leftTotalsRow = `<tr class="totals-row"><td colspan="10" style="text-align:left">TOTALS \u2014 Tax-Free Income (Median)</td><td style="color:#c9a84c">${$f(totalEPIncome)}</td><td>\u2014</td><td>\u2014</td></tr>`;

      let rightRows='';
      ageRange.forEach(a=>{
        const yr = a - d.issueAge + 1;
        if (yr>maxDBYear) return;
        const isFund = yr<=d.contribYears;
        const isPayoff = yr === d.refiYear;
        const dbRow = dbByYear[yr];

        const rowClsR = isPayoff ? 'payoff-yr' : isFund ? 'fund-yr' : 'post-yr';

        rightRows += `<tr class="${rowClsR}">
          <td>${yr}</td><td>${a}</td>
          <td>${dbRow?$f(dbRow.av):'\u2014'}</td>
          <td style="color:${dbRow&&dbRow.csvNet<0?'var(--red)':'inherit'}">${dbRow?(dbRow.csvNet<0?'('+$f(Math.abs(dbRow.csvNet))+')':$f(dbRow.csvNet)):'\u2014'}</td>
          <td style="font-weight:600">${dbRow?$f(dbRow.dbNet):'\u2014'}</td>
        </tr>`;
      });

      const disc = `<div class="disc-3col">
        <div>The hypothetical models in this summary assume certain crediting methods and index account charges that are purely hypothetical and do not represent any particular investment or product. Hypothetical crediting methods, charges, values and returns are not guaranteed. Left-panel returns are bootstrapped historical S&amp;P 500 returns (${d.dataYears}-yr pool); the right panel uses the carrier's own stated illustrated rate${_dbAssumedRate?' ('+_dbAssumedRate+')':''}, not a Monte Carlo simulation.</div>
        <div>EFS Life LLC and its related entities' programs, strategies, solutions, and platforms are not intended to be investment advice. The Enhanced Pension structure and related benefits shown are hypothetical. The finance arrangement is offered by EFS Life LLC. Right-panel CSV/DB net figures assume no income is ever drawn; the tax-financing loan is projected through Policy Year ${d.refiYear-1}, and the carrier's uploaded figures are used as-is from Policy Year ${d.refiYear} forward, already reflecting the policy loan. Both net figures add back the PDA balance still un-deployed at that policy year.</div>
        <div>The benefits and values shown are not guaranteed. The assumptions on which they are based are subject to change. Actual results may be more or less favorable. THIS IS A HYPOTHETICAL MODEL. REFER TO THE FULL ILLUSTRATION FOR DETAILS, CHARGES, GUARANTEES AND GUIDELINES. EnhancedPension.com \u00b7 EFS Life LLC${d.advisor?' \u00b7 '+d.advisor:''} \u00b7 ${dateStr} \u00b7 Death benefit figures not valid without a complete carrier illustration.</div>
      </div>`;

      return `
        <div class="eta-page-hdr">
          <div>
            <div class="eyebrow">Enhanced Pension \u2014 EP Income (Bootstrapped) vs. Death Benefit Focused (Illustrated)</div>
            <div class="title">${d.clientName}</div>
            <div class="meta-line">Client: ${d.clientName} &nbsp;|&nbsp; Advisor: ${d.advisor||'\u2014'} &nbsp;|&nbsp; Annual Compensation: ${$f(d.comp)} &nbsp;|&nbsp; Combined Tax Rate: ${fmtPct(d.taxRate)} &nbsp;|&nbsp; PDA Rate: ${fmtPct(d.pdaRate)} &nbsp;|&nbsp; PLR: ${fmtPct(d.plr)}</div>
          </div>
          <div class="ver-block">
            <div class="vdate">${dateStr}</div>
            <div style="font-size:9px;color:rgba(255,255,255,.3);margin-top:2px">${d.nSims.toLocaleString()} simulations \u00b7 ${d.dataYears}-yr pool</div>
          </div>
        </div>
        ${statStrip}
        <div class="dual-panel db-mode">
          <div>
            <table class="dual">
              <colgroup><col style="width:3.5%"><col style="width:4.5%"><col style="width:7.7%"><col style="width:7.7%"><col style="width:7.7%"><col style="width:7.7%"><col style="width:7.7%"><col style="width:7.7%"><col style="width:7.7%"><col style="width:7.7%"><col style="width:11%"><col style="width:9.5%"><col style="width:9.8%"></colgroup>
              <thead>
                <tr><th colspan="13" style="background:var(--navy);color:var(--gold);font-size:9px;letter-spacing:2px;text-transform:uppercase;font-weight:600;text-align:left;padding:8px 12px;border-left:3px solid var(--gold)">Enhanced Pension Income \u2014 Median (50th Percentile) \u00b7 Bootstrapped Monte Carlo</th></tr>
                <tr>
                  <th style="border-left:3px solid var(--gold)">Yr</th><th>Age</th>
                  <th>Contrib \u2192 PDA</th><th>PDA \u2192 Asset</th><th>PDA Balance</th>
                  <th>Lender Rate</th><th>Loan for Tax</th><th>Interest</th><th>Loan Balance</th>
                  <th>Loan Payoff</th><th>Tax-Free Income</th><th>Asset Value</th><th>Net Asset Value</th>
                </tr>
              </thead>
              <tbody>${leftRows}${leftTotalsRow}</tbody>
            </table>
          </div>
          <div class="right-panel-wrap">
            <table class="dual">
              <colgroup><col style="width:10%"><col style="width:10%"><col style="width:26%"><col style="width:27%"><col style="width:27%"></colgroup>
              <thead>
                <tr><th colspan="5" style="background:rgba(42,110,69,.9);color:#fff;font-size:9px;letter-spacing:2px;text-transform:uppercase;font-weight:600;text-align:left;padding:8px 12px;border-left:3px solid var(--gold)">Death Benefit Focused \u2014 Illustrated at ${rateLabel}, No Income Drawn</th></tr>
                <tr>
                  <th style="border-left:3px solid var(--gold)">Yr</th><th>Age</th>
                  <th>Gross Accumulated Value</th><th>CSV Net of Loan (Incl. PDA)</th><th>DB Net of Loan (Incl. PDA)</th>
                </tr>
              </thead>
              <tbody>${rightRows}</tbody>
            </table>
          </div>
        </div>
        ${disc}`;
    }

    // ══════════════════════════════════════════════════════════
    // DUAL-PANEL GREENSHEET PAGE — Comparator (left) vs EP (right), median
    // ══════════════════════════════════════════════════════════
    function buildGreensheetPage(comparatorLabel, comparatorRows, epRows, pageEyebrow, comparatorType){
      const netInvested = comparatorType==='qp' ? d.comp : d.comp*(1-d.taxRate/100);
      const compByAge = {}; comparatorRows.forEach(r=>compByAge[r.age]=r);
      const incomeAges = ageRange.filter(a=>a>=d.incStart && a<=d.incEnd);

      const totalCompGross = incomeAges.reduce((s,a)=>s+((compByAge[a]||{}).gross||0),0);
      const totalCompNet = incomeAges.reduce((s,a)=>s+((compByAge[a]||{}).net||0),0);
      const totalCompTax = totalCompGross - totalCompNet;
      const totalEPIncome = incomeAges.reduce((s,a)=>s+((epByAge50[a]||{}).income||0),0);
      const incomeAdv = totalEPIncome - totalCompNet;
      const endEP = epByAge50[d.incEnd] || {};

      const statStrip = `
        <div class="stat-strip">
          <div class="stat-box">
            <div class="sb-label">Total ${comparatorLabel}<br>Contribution (Gross)</div>
            <div class="sb-val">${$f(d.contribTotal)}</div>
            <div class="sb-sub">${d.contribYears} years of ${$f(d.comp)}/yr</div>
          </div>
          <div class="stat-box">
            <div class="sb-label">Total EP Premium<br>Into Tax-Free Asset</div>
            <div class="sb-val">${$f(totalPremium)}</div>
            <div class="sb-sub">${d.contribYears} annual premiums, PDA-funded</div>
          </div>
          <div class="stat-box">
            <div class="sb-label">Total Net Distributions<br>${comparatorLabel} (After Tax)</div>
            <div class="sb-val">${$f(totalCompNet)}</div>
          </div>
          <div class="stat-box">
            <div class="sb-label">Taxes Paid — ${comparatorLabel}</div>
            <div class="sb-val">${$f(totalCompTax)}</div>
            <div class="sb-sub">Ages ${d.incStart}\u2013${d.incEnd}</div>
          </div>
          <div class="stat-box hl">
            <div class="sb-label">Total EP Income<br>Tax-Free Drawdowns</div>
            <div class="sb-val">${$f(totalEPIncome)}</div>
            <div class="sb-sub">Median (50th percentile)</div>
          </div>
          <div class="stat-box hl">
            <div class="sb-label">Net Asset Value at Age ${d.incEnd}<br>Net of All Loans</div>
            <div class="sb-val">${$f(endEP.csvNetTotal)}</div>
            <div class="sb-adv">EP Income Advantage: +${$f(incomeAdv)}</div>
          </div>
        </div>`;

      let leftRows='', rightRows='', prevSection='';
      ageRange.forEach(a=>{
        const yr = a - d.issueAge + 1;
        const isIncome = a>=d.incStart && a<=d.incEnd;
        const isFund = yr<=d.contribYears;
        const ep = epByAge50[a] || {};
        const isPayoff = ep.isPayoff;

        let secHdr='';
        if (yr===1 && prevSection!=='fund'){ secHdr = `ACCUMULATION PHASE \u2014 YEARS 1\u2013${d.incStart-d.issueAge} (NO DISTRIBUTIONS)`; prevSection='fund'; }
        if (isIncome && prevSection!=='income'){ secHdr = `DISTRIBUTION PHASE \u2014 YEARS ${d.incStart-d.issueAge+1}\u2013${d.incEnd-d.issueAge+1} (INCOME DISTRIBUTIONS BEGIN)`; prevSection='income'; }

        const rowCls = isPayoff ? 'payoff-yr' : isIncome ? 'income-yr' : isFund ? 'fund-yr' : 'post-yr';
        if (secHdr){ leftRows += `<tr class="sec-hdr"><td colspan="9">${secHdr}</td></tr>`; rightRows += `<tr class="sec-hdr"><td colspan="13">${secHdr}</td></tr>`; }

        // LEFT — comparator (QP or Investment Account), identical row shape
        const comp = compByAge[a] || {};
        const prevComp = compByAge[a-1];
        const prevEOY = prevComp ? prevComp.bal : 0;
        const compEOY = comp.bal || 0;
        const compGross = comp.gross || 0;
        const compNet = comp.net || 0;
        const compTax = compGross - compNet;
        const compInvested = isFund ? netInvested : 0;
        // BOY = prior EOY + this year's deposit (funded balance BEFORE return is applied).
        // Growth = the actual return dollar amount applied to that funded balance —
        // NOT (EOY − prior EOY), which would silently fold the deposit itself into "growth."
        const compBOY = prevEOY + compInvested;
        const compGrowth = compEOY - compBOY;

        leftRows += `<tr class="${rowCls}">
          <td>${yr}</td><td>${a}</td>
          <td>${compInvested>0 ? $f(compInvested) : '\u2014'}</td>
          <td>${$f(compBOY)}</td>
          <td>${compGrowth!==0 ? $f(compGrowth) : '\u2014'}</td>
          <td>${isIncome && compTax>0 ? $f(compTax) : '\u2014'}</td>
          <td class="${isIncome?'inc-val':''}">${isIncome?$f(compGross):'\u2014'}</td>
          <td class="${isIncome?'inc-val':''}">${isIncome?$f(compNet):'\u2014'}</td>
          <td>${$f(compEOY)}</td>
        </tr>`;

        // RIGHT — EP
        const contrib = isFund ? $f(d.comp) : '\u2014';
        const pdaRow = pdaByYr[yr];
        const pdaToAsset = (pdaRow && yr<=d.contribYears) ? $f(pdaRow.premium) : '\u2014';
        const pdaBal = (pdaRow && yr<=d.contribYears) ? $f(Math.max(0,pdaRow.eoy)) : '\u2014';
        const lenderRate = ep.lenderRate!=null ? fmtPct(ep.lenderRate) : '\u2014';
        const loanForTax = ep.financedTax>0 ? $f(ep.financedTax) : '\u2014';
        const interest = ep.interest>0 ? $f(ep.interest) : '\u2014';
        const loanBal = ep.loan!=null ? $f(ep.loan) : '\u2014';
        const loanPayoff = isPayoff ? $f(ep.loan) : '\u2014';
        const taxFreeInc = isIncome ? $f(ep.income) : '\u2014';

        rightRows += `<tr class="${rowCls}">
          <td>${yr}</td><td>${a}</td>
          <td>${contrib}</td>
          <td>${pdaToAsset}</td>
          <td>${pdaBal}</td>
          <td>${lenderRate}</td>
          <td>${loanForTax}</td>
          <td>${interest}</td>
          <td>${loanBal}</td>
          <td>${isPayoff ? `<strong style="color:#c9a84c">${loanPayoff}</strong>` : loanPayoff}</td>
          <td class="${isIncome?'inc-val':''}">${taxFreeInc}</td>
          <td>${$f(ep.av)}</td>
          <td>${$f(ep.csvNetTotal)}</td>
        </tr>`;
      });

      const totalCompInvested = d.contribYears * netInvested;
      const leftFoot = `<tr><td colspan="2">Totals</td><td>${$f(totalCompInvested)}</td><td>\u2014</td><td>\u2014</td><td>${$f(totalCompTax)}</td><td>${$f(totalCompGross)}</td><td>${$f(totalCompNet)}</td><td>\u2014</td></tr>`;
      const rightFoot = `<tr><td colspan="10" style="text-align:left">TOTALS \u2014 Tax-Free Income (Median)</td><td style="color:#c9a84c">${$f(totalEPIncome)}</td><td>\u2014</td><td>\u2014</td></tr>`;

      const summaryCards = `
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:2px solid var(--gold);border-bottom:1px solid var(--border)">
          <div style="padding:11px 20px;border-right:1px solid var(--border)">
            <div style="font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Total EP Tax-Free Income<br>Median (50th Percentile)</div>
            <div style="font-family:'Playfair Display',serif;font-size:22px;color:var(--gold);font-weight:600">${$f(totalEPIncome)}</div>
            <div style="font-size:9px;color:var(--muted);margin-top:3px">Ages ${d.incStart}\u2013${d.incEnd} \u00b7 ${d.cola}% COLA \u00b7 Tax-free asset loans</div>
          </div>
          <div style="padding:11px 20px;border-right:1px solid var(--border)">
            <div style="font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Total ${comparatorLabel} Net Distributions<br>Median (50th Percentile)</div>
            <div style="font-family:'Playfair Display',serif;font-size:22px;color:var(--red)">${$f(totalCompNet)}</div>
            <div style="font-size:9px;color:var(--muted);margin-top:3px">Ages ${d.incStart}\u2013${d.incEnd}</div>
          </div>
          <div style="padding:11px 20px;border-right:1px solid var(--border)">
            <div style="font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Net Asset Value at Age ${d.incEnd}<br>Net of All Asset Loans</div>
            <div style="font-family:'Playfair Display',serif;font-size:22px;color:var(--navy)">${$f(endEP.csvNetTotal)}</div>
            <div style="font-size:9px;color:var(--muted);margin-top:3px">Asset loan retires from death benefit</div>
          </div>
          <div style="padding:11px 20px">
            <div style="font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px">EP Income Advantage<br>vs. ${comparatorLabel} (Median)</div>
            <div style="font-family:'Playfair Display',serif;font-size:22px;color:var(--green)">+${$f(incomeAdv)}</div>
            <div style="font-size:9px;color:var(--muted);margin-top:3px">${(totalEPIncome/Math.max(totalCompNet,1)).toFixed(2)}\u00d7 more income \u00b7 Tax-free vs. taxable</div>
          </div>
        </div>`;

      const disc = `<div class="disc-3col">
        <div>The hypothetical models in this summary assume certain crediting methods and index account charges that are purely hypothetical and do not represent any particular investment or product. Hypothetical crediting methods, charges, values and returns are not guaranteed. Hypothetical returns used in this summary are bootstrapped historical S&amp;P 500 returns (${d.dataYears}-yr pool) used purely as a hypothetical example of index volatility over a period of time.</div>
        <div>EFS Life LLC and its related entities' programs, strategies, solutions, and platforms are not intended to be investment advice or a recommendation of any stock or index. The Enhanced Pension structure and related benefits shown are hypothetical. The finance arrangement is offered by EFS Life LLC. All platforms, programs, solutions, media mediums, and collateral pieces are not valid unless accompanied by a complete illustration.</div>
        <div>The benefits and values shown are not guaranteed. The assumptions on which they are based are subject to change. Actual results may be more or less favorable. THIS IS A HYPOTHETICAL MODEL. REFER TO THE FULL ILLUSTRATION FOR DETAILS, CHARGES, GUARANTEES AND GUIDELINES. EnhancedPension.com \u00b7 EFS Life LLC${d.advisor?' \u00b7 '+d.advisor:''} \u00b7 ${dateStr}</div>
      </div>`;

      return `
        <div class="eta-page-hdr">
          <div>
            <div class="eyebrow">${pageEyebrow}</div>
            <div class="title">${d.clientName}</div>
            <div class="meta-line">Client: ${d.clientName} &nbsp;|&nbsp; Advisor: ${d.advisor||'\u2014'} &nbsp;|&nbsp; Annual Compensation: ${$f(d.comp)} &nbsp;|&nbsp; Combined Tax Rate: ${fmtPct(d.taxRate)} &nbsp;|&nbsp; PDA Rate: ${fmtPct(d.pdaRate)} &nbsp;|&nbsp; PLR: ${fmtPct(d.plr)}</div>
          </div>
          <div class="ver-block">
            <div class="vdate">${dateStr}</div>
            <div style="font-size:9px;color:rgba(255,255,255,.3);margin-top:2px">${d.nSims.toLocaleString()} simulations \u00b7 ${d.dataYears}-yr pool</div>
          </div>
        </div>
        ${statStrip}
        <div class="dual-panel">
          <div>
            <table class="dual">
              <colgroup><col style="width:4.5%"><col style="width:5.5%"><col style="width:13.3%"><col style="width:13.3%"><col style="width:13.3%"><col style="width:13.3%"><col style="width:13.4%"><col style="width:13.4%"><col style="width:10%"></colgroup>
              <thead>
                <tr><th colspan="9" style="background:var(--navy);color:var(--gold);font-size:9px;letter-spacing:2px;text-transform:uppercase;font-weight:600;text-align:left;padding:8px 12px">${comparatorLabel} \u00b7 50th Percentile</th></tr>
                <tr><th>Yr</th><th>Age</th><th>Net Invested</th><th>BOY Balance</th><th>Growth</th><th>Tax Paid</th><th>Gross Distribution</th><th>Net Distribution</th><th>EOY Balance</th></tr>

              <colgroup><col style="width:3.5%"><col style="width:4.5%"><col style="width:7.7%"><col style="width:7.7%"><col style="width:7.7%"><col style="width:7.7%"><col style="width:7.7%"><col style="width:7.7%"><col style="width:7.7%"><col style="width:7.7%"><col style="width:11%"><col style="width:9.5%"><col style="width:9.8%"></colgroup>
              <thead>
                <tr><th colspan="13" style="background:var(--navy);color:var(--gold);font-size:9px;letter-spacing:2px;text-transform:uppercase;font-weight:600;text-align:left;padding:8px 12px;border-left:3px solid var(--gold)">Enhanced Pension</th></tr>
                <tr>
                  <th style="border-left:3px solid var(--gold)">Yr</th><th>Age</th>
                  <th>Contrib \u2192 PDA</th><th>PDA \u2192 Asset</th><th>PDA Balance</th>
                  <th>Lender Rate</th><th>Loan for Tax</th><th>Interest</th><th>Loan Balance</th>
                  <th>Loan Payoff</th><th>Tax-Free Income</th><th>Asset Value</th><th>Net Asset Value</th>
                </tr>
              </thead>
              <tbody>${rightRows}</tbody>
              <tfoot>${rightFoot}</tfoot>
            </table>
          </div>
        </div>
        ${summaryCards}
        ${disc}`;
    }

    // ══════════════════════════════════════════════════════════
    // CHART — EP 25th/50th/75th cumulative income vs comparator(s) 50th
    // ══════════════════════════════════════════════════════════
    function buildChart(){
      const W=1060,H=280,PL=88,PR=24,PT=34,PB=34,cW=W-PL-PR,cH=H-PT-PB;
      const ages = ageRange.filter(a=>a>=d.incStart&&a<=d.incEnd);
      if (ages.length<2) return '';
      function cumEP(byAgeMap){ let c=0; return ages.map(a=>{ c+=((byAgeMap[a]||{}).income||0); return c; }); }
      function cumComp(rows){ const byAge={}; rows.forEach(r=>byAge[r.age]=r); let c=0; return ages.map(a=>{ c+=((byAge[a]||{}).net||0); return c; }); }
      const ci25=cumEP(epByAge25), ci50=cumEP(epByAge50), ci75=cumEP(epByAge75);
      const series = [
        {label:'25th (Conservative)', color:'#8a8070', dash:'4,4', width:1.5, data:ci25},
        {label:'50th Median \u2014 EP', color:'#c9a84c', dash:'', width:3, data:ci50},
        {label:'75th (Favorable)', color:'#2a6e45', dash:'6,3', width:2, data:ci75},
      ];
      if (!isStandalone && d.investRows50) series.push({label:'Investment Acct Net \u2014 Median', color:'rgba(100,140,200,.9)', dash:'6,3', width:1.5, data:cumComp(d.investRows50)});
      if (!isStandalone && showQP && d.qpRows50) series.push({label:'QP Taxable Net \u2014 Median', color:'rgba(139,32,32,.7)', dash:'2,3', width:1.5, data:cumComp(d.qpRows50)});

      const maxVal = Math.max(...series.flatMap(s=>s.data))*1.08||1;
      const xS = i=>PL+(i/(ages.length-1))*cW;
      const yS = v=>PT+cH-(v/maxVal)*cH;
      const pth = arr=>arr.map((v,i)=>`${i===0?'M':'L'}${xS(i).toFixed(1)},${yS(v).toFixed(1)}`).join(' ');
      const $m = n=>n>=1e6?'$'+(n/1e6).toFixed(1)+'M':n>=1000?'$'+(n/1000).toFixed(0)+'k':'$'+Math.round(n);
      const yTicks=[]; for(let v=0;v<=maxVal;v+=maxVal/5) yTicks.push(v);
      const xLabels = ages.filter((a,i)=>i===0||i===ages.length-1||(a%5===0));

      let legendX = PL+10;
      const legend = series.map(s=>{
        const html = `<line x1="${legendX}" y1="18" x2="${legendX+16}" y2="18" stroke="${s.color}" stroke-width="${s.width}" ${s.dash?`stroke-dasharray="${s.dash}"`:''}/><text x="${legendX+21}" y="22" fill="rgba(13,27,46,.65)" font-size="10" font-family="IBM Plex Sans,sans-serif">${s.label}</text>`;
        legendX += 26+s.label.length*5.6;
        return html;
      }).join('');

      const lX = xS(ages.length-1)-8;
      const endLabels = series.map(s=>`<text x="${lX}" y="${(yS(s.data[s.data.length-1])-5).toFixed(1)}" fill="${s.color}" font-size="9" text-anchor="end">${s.label.split(' ')[0]}</text>`).join('');

      return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block">
        ${legend}
        ${series.map(s=>`<path d="${pth(s.data)}" fill="none" stroke="${s.color}" stroke-width="${s.width}" ${s.dash?`stroke-dasharray="${s.dash}"`:''} stroke-linejoin="round"/>`).join('')}
        ${endLabels}
        <line x1="${PL}" y1="${PT}" x2="${PL}" y2="${PT+cH}" stroke="rgba(13,27,46,.12)" stroke-width="1"/>
        ${yTicks.map(v=>`<line x1="${PL-4}" y1="${yS(v).toFixed(1)}" x2="${PL+cW}" y2="${yS(v).toFixed(1)}" stroke="rgba(13,27,46,.05)" stroke-width="1"/><text x="${PL-8}" y="${(yS(v)+4).toFixed(1)}" fill="rgba(13,27,46,.45)" font-size="10" font-family="IBM Plex Mono,monospace" text-anchor="end">${$m(v)}</text>`).join('')}
        <line x1="${PL}" y1="${PT+cH}" x2="${PL+cW}" y2="${PT+cH}" stroke="rgba(13,27,46,.15)" stroke-width="1"/>
        ${xLabels.map(a=>{const xi=ages.indexOf(a);return`<text x="${xS(xi).toFixed(1)}" y="${PT+cH+15}" fill="rgba(13,27,46,.5)" font-size="10" font-family="IBM Plex Mono,monospace" text-anchor="middle">${a}</text>`;}).join('')}
      </svg>`;
    }

    // ══════════════════════════════════════════════════════════
    // SCENARIO ANALYSIS PAGE — 25/50/75 cards + chart
    // ══════════════════════════════════════════════════════════
    function buildScenarioAnalysisPage(){
      const incomeAges = ageRange.filter(a=>a>=d.incStart&&a<=d.incEnd);
      const totalByBand = d.totalByBand;
      const primaryCompLabel = d.investRows50 ? 'Taxable Investment Account' : 'Qualified Plan';
      const primaryCompTotal = d.investTotalMed;
      const incomeAdv = totalByBand[50] - primaryCompTotal;
      const endEP = epByAge50[d.incEnd] || {};

      const scenarioStrip = `
        <div class="scenario-strip">
          <div class="sc-band">
            <div class="sc-name">25th Percentile \u2014 Conservative Sequence</div>
            <div class="sc-inc">${$f(d.bandIncome[25])}</div>
            <div class="sc-sub">Tax-free \u00b7 Age ${d.incStart} Year 1</div>
            <div class="sc-total">Total: ${$f(totalByBand[25])}</div>
          </div>
          <div class="sc-band median">
            <div class="sc-name">50th Percentile \u2014 Median Base Case</div>
            <div class="sc-inc">${$f(d.bandIncome[50])}</div>
            <div class="sc-sub">Tax-free \u00b7 Age ${d.incStart} Year 1</div>
            <div class="sc-total">Total: ${$f(totalByBand[50])}</div>
          </div>
          <div class="sc-band">
            <div class="sc-name">75th Percentile \u2014 Favorable Sequence</div>
            <div class="sc-inc">${$f(d.bandIncome[75])}</div>
            <div class="sc-sub">Tax-free \u00b7 Age ${d.incStart} Year 1</div>
            <div class="sc-total">Total: ${$f(totalByBand[75])}</div>
          </div>
        </div>`;

      const summaryCols = [];
      if (!isStandalone){
        summaryCols.push({label:'Investment Acct Net Income (Median)', val:$f(d.investTotalMed), color:'var(--red)', sub:`Ages ${d.incStart}\u2013${d.incEnd}`});
        if (showQP) summaryCols.push({label:'QP Net Distributions (Median)', val:$f(d.qpTotalMed), color:'var(--red)', sub:`Ages ${d.incStart}\u2013${d.incEnd}`});
        summaryCols.push({label:'EP Tax-Free Income Advantage (Median)', val:'+'+$f(incomeAdv), color:'var(--green)', sub:`${(totalByBand[50]/Math.max(primaryCompTotal,1)).toFixed(2)}\u00d7 more income vs. ${primaryCompLabel}`});
        // Net Asset Value only appears here in comparator mode. In standalone
        // mode this figure sits right alongside the illustrated-carrier
        // death-benefit page, where a similarly-sized dollar figure risks
        // being mistaken for a death benefit number — so it's dropped there.
        summaryCols.push({label:`Net Asset Value at Age ${d.incEnd} (Median)`, val:$f(endEP.csvNetTotal), color:'var(--navy)', sub:'Net of all asset loans'});
      }

      const summaryRow = summaryCols.length ? `<div style="display:grid;grid-template-columns:repeat(${summaryCols.length},1fr);border-bottom:1px solid var(--border)">
        ${summaryCols.map((c,i)=>`<div style="padding:14px 20px;${i<summaryCols.length-1?'border-right:1px solid var(--border)':''}">
          <div style="font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px">${c.label}</div>
          <div style="font-family:'Playfair Display',serif;font-size:22px;color:${c.color}">${c.val}</div>
          <div style="font-size:9px;color:var(--muted);margin-top:3px">${c.sub}</div>
        </div>`).join('')}
      </div>` : '';

      const pctExplain = `
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:16px 28px;border-bottom:1px solid var(--border)">
          <div style="background:var(--off);border:1px solid var(--border);border-radius:4px;padding:14px 16px">
            <div style="font-size:8px;letter-spacing:2px;text-transform:uppercase;color:#8b2020;margin-bottom:6px;font-weight:600">25th \u2014 Conservative</div>
            <div style="font-size:11px;color:var(--text);line-height:1.5">In 75% of sequences the outcome exceeded this level \u2014 a below-average but realistic planning floor.</div>
          </div>
          <div style="background:var(--off);border:1px solid var(--border);border-radius:4px;padding:14px 16px">
            <div style="font-size:8px;letter-spacing:2px;text-transform:uppercase;color:#c9a84c;margin-bottom:6px;font-weight:600">50th \u2014 Median</div>
            <div style="font-size:11px;color:var(--text);line-height:1.5">Half of all ${d.nSims.toLocaleString()} simulated market sequences produced more income than this; half produced less. This is the base case.</div>
          </div>
          <div style="background:var(--off);border:1px solid var(--border);border-radius:4px;padding:14px 16px">
            <div style="font-size:8px;letter-spacing:2px;text-transform:uppercase;color:#2a6e45;margin-bottom:6px;font-weight:600">75th \u2014 Favorable</div>
            <div style="font-size:11px;color:var(--text);line-height:1.5">In 25% of simulated sequences \u2014 above-average market performance \u2014 the EP asset produced income above this level.</div>
          </div>
        </div>`;

      const chartSVG = buildChart();
      const compTitle = isStandalone ? null : (showQP ? 'Qualified Plan & Taxable Investment Account' : 'Taxable Investment Account');

      return `
        <div class="pg2-hdr">
          <div>
            <div style="font-size:9px;letter-spacing:3px;text-transform:uppercase;color:rgba(201,168,76,.7);margin-bottom:4px">Enhanced Pension \u00b7 Monte Carlo Scenario Analysis</div>
            <div class="title">${d.clientName} \u2014 ${d.nSims.toLocaleString()} Market Sequences \u00b7 ${d.dataYears}-yr pool</div>
            <div class="sub">Ages ${d.incStart}\u2013${d.incEnd} \u00b7 ${d.cola}% COLA${compTitle?` \u00b7 vs. ${compTitle}`:' \u00b7 Standalone (EP Only)'} \u00b7 ${dateStr}${d.advisor?' \u00b7 '+d.advisor:''}</div>
          </div>
        </div>
        ${scenarioStrip}
        ${summaryRow}
        ${pctExplain}
        <div style="padding:12px 28px 0">
          <div style="font-family:'Playfair Display',serif;font-size:14px;color:var(--navy);margin-bottom:3px">Cumulative Income \u2014 EP Tax-Free${compTitle?` vs. ${compTitle} (Median)`:''}</div>
          <div style="font-size:9px;color:var(--muted);margin-bottom:8px">${d.nSims.toLocaleString()} bootstrapped S&amp;P 500 sequences (${d.dataYears}-yr pool) \u00b7 ${d.capRate}% cap / 0% floor</div>
          ${chartSVG}
        </div>
        <div class="disc-3col" style="margin-top:auto">
          <div>The hypothetical models in this summary assume certain crediting methods and charges that are purely hypothetical and do not represent any particular investment or product. Returns shown are bootstrapped historical S&amp;P 500 sequences (${d.dataYears}-yr pool).</div>
          <div>EFS Life LLC and its related entities are not providing investment advice. The EP structure shown is hypothetical. Income figures reflect the median (50th percentile) and scenario bands across ${d.nSims.toLocaleString()} simulations.</div>
          <div>Benefits and values shown are not guaranteed. THIS IS A HYPOTHETICAL MODEL. EnhancedPension.com \u00b7 EFS Life LLC${d.advisor?' \u00b7 '+d.advisor:''} \u00b7 ${dateStr}</div>
        </div>`;
    }

    // ══════════════════════════════════════════════════════════
    // SCENARIO LEDGER PAGE — year by year, EP 25/50/75 + comparator(s)
    // ══════════════════════════════════════════════════════════
    function buildScenarioLedgerPage(){
      const investByAge = {}; (d.investRows50||[]).forEach(r=>investByAge[r.age]=r);
      const qpByAge = {}; (d.qpRows50||[]).forEach(r=>qpByAge[r.age]=r);
      // In standalone mode, the dedicated EP-vs-Death-Benefit two-panel page
      // (buildEPvsDBPage) is the home for this comparison — don't also
      // duplicate it as appended columns here. Only append here for the
      // comparator (vs. investment/QP) case, which has no two-panel page.
      const showDB = !!dbByYear && !isStandalone;

      const displayAges = [];
      ageRange.forEach(a=>{
        const isIncome = a>=d.incStart && a<=d.incEnd;
        if (isIncome){ displayAges.push({a, tranche:false}); return; }
        if (a===ageRange[0] || a%5===0 || a===d.incStart-1 || a===d.incEnd+5 || a===ageRange[ageRange.length-1]){
          displayAges.push({a, tranche:true});
        }
      });

      const baseCols = isStandalone ? 8 : 10; // Yr/Age + (comparator x2, standalone drops these) + EP25/50/75 + AV/Loan/NetAV
      const totalCols = baseCols + (showDB ? 3 : 0);

      let rows='', prevSection='';
      displayAges.forEach(({a,tranche})=>{
        const yr = a - d.issueAge + 1;
        const isIncome = a>=d.incStart && a<=d.incEnd;
        const isPost = a>d.incEnd;
        const ep50 = epByAge50[a]||{};
        const isPayoff = ep50.isPayoff;

        let secHdr='';
        if (yr===1 && prevSection!=='acc'){ secHdr=`ACCUMULATION PHASE \u2014 YEARS 1\u2013${d.incStart-d.issueAge} (NO DISTRIBUTIONS)`; prevSection='acc'; }
        if (isIncome && prevSection!=='inc'){ secHdr=`DISTRIBUTION PHASE \u2014 YEARS ${d.incStart-d.issueAge+1}\u2013${d.incEnd-d.issueAge+1} (INCOME BEGINS \u2014 AGES ${d.incStart}\u2013${d.incEnd})`; prevSection='inc'; }
        if (isPost && prevSection!=='post'){ secHdr='POST-INCOME \u2014 ASSET CONTINUES TO GROW'; prevSection='post'; }

        const e25=epByAge25[a]||{}, e50=epByAge50[a]||{}, e75=epByAge75[a]||{};
        const inv=investByAge[a]||{}, qp=qpByAge[a]||{};
        const rowCls = isPayoff?'payoff-yr':isIncome?'income-yr':'';
        const yrCell = tranche?`<td style="font-weight:700;background:rgba(201,168,76,.08)">${yr}</td>`:`<td>${yr}</td>`;
        const ageCell = tranche?`<td style="font-weight:700;color:var(--gold);background:rgba(201,168,76,.08)">${a}</td>`:`<td>${a}</td>`;

        if (secHdr) rows += `<tr class="sec-hdr"><td colspan="${totalCols}">${secHdr}</td></tr>`;

        const comparatorCells = isStandalone ? '' : `
          <td class="${isIncome?'green-col':''}">${isIncome?$f(showQP?qp.net:inv.net):'\u2014'}</td>
          ${showQP?`<td class="${isIncome?'green-col':''}">${isIncome?$f(inv.net):'\u2014'}</td>`:`<td>${$f(inv.bal)}</td>`}`;

        const dbRow = showDB ? dbByYear[yr] : null;
        const dbCells = showDB ? `
          <td style="border-left:2px solid rgba(139,101,20,.3)">${dbRow?$f(dbRow.av):'\u2014'}</td>
          <td style="color:${dbRow&&dbRow.csvNet<0?'var(--red)':'inherit'}">${dbRow?(dbRow.csvNet<0?'('+$f(Math.abs(dbRow.csvNet))+')':$f(dbRow.csvNet)):'\u2014'}</td>
          <td style="font-weight:600">${dbRow?$f(dbRow.dbNet):'\u2014'}</td>` : '';

        rows += `<tr class="${rowCls}">
          ${yrCell}${ageCell}
          ${comparatorCells}
          <td style="border-left:2px solid rgba(201,168,76,.25)">${isIncome?$f(e25.income):'\u2014'}</td>
          <td class="${isIncome?'gold-col':''}">${isIncome?$f(e50.income):'\u2014'}</td>
          <td>${isIncome?$f(e75.income):'\u2014'}</td>
          <td style="border-left:2px solid rgba(13,27,46,.12)">${$f(e50.av)}</td>
          <td>${$f(e50.loan)}</td>
          <td>${$f(e50.csvNetTotal)}</td>
          ${dbCells}
        </tr>`;
      });

      const totalByBand = d.totalByBand;
      const foot = `<tr>
        <td colspan="2">Totals (Income Period)</td>
        ${isStandalone ? '' : `
        <td class="green-col">${$f(showQP?d.qpTotalMed:d.investTotalMed)}</td>
        <td class="green-col">${showQP?$f(d.investTotalMed):'\u2014'}</td>`}
        <td style="border-left:2px solid rgba(201,168,76,.25)">${$f(totalByBand[25])}</td>
        <td class="gold-col">${$f(totalByBand[50])}</td>
        <td>${$f(totalByBand[75])}</td>
        <td style="border-left:2px solid rgba(13,27,46,.12)">\u2014</td><td>\u2014</td><td>\u2014</td>
        ${showDB ? '<td>\u2014</td><td>\u2014</td><td>\u2014</td>' : ''}
      </tr>`;

      const col3Label = showQP ? 'QP Net' : 'Investment Net';
      const col4Label = showQP ? 'Invest Net' : 'Investment Balance';
      const colLabelsLine = isStandalone
        ? `Yr / Age / EP 25th / EP 50th / EP 75th / Asset Value / Loan Balance / Net Asset Value${showDB?' / Gross AV / CSV Net of Loans / DB Net of Loans':''}`
        : `Yr / Age / ${col3Label} / ${col4Label} / EP 25th / EP 50th / EP 75th / Asset Value / Loan Balance / Net Asset Value${showDB?' / Gross AV / CSV Net of Loans / DB Net of Loans':''}`;

      return `
        <div class="pg2-hdr">
          <div>
            <div style="font-size:9px;letter-spacing:3px;text-transform:uppercase;color:rgba(201,168,76,.7);margin-bottom:4px">Enhanced Pension \u00b7 Year-by-Year Scenario Ledger${showDB?' \u00b7 Income + Death Benefit Focused':''}</div>
            <div class="title">${d.clientName} \u2014 ${d.nSims.toLocaleString()} Simulations \u00b7 ${d.dataYears}-yr pool</div>
            <div class="sub">Column order: ${colLabelsLine} \u00b7 Median (50th) path for income-side balance columns \u00b7 ${dateStr}${d.advisor?' \u00b7 '+d.advisor:''}</div>
          </div>
        </div>
        <div style="padding:12px 28px;overflow-x:auto">
          <table class="sc-ldg" style="font-size:${showDB?'9.5px':'10.5px'};min-width:${showDB?'1420':'1100'}px">
            <colgroup>${(() => {
              const w = [4,5]; // Yr, Age
              if (!isStandalone) w.push(11,11); // comparator x2
              w.push(9,9,9); // EP 25/50/75
              w.push(11,11,11); // AV/Loan/NetAV
              if (showDB) w.push(11,11,11); // Gross AV/CSV Net/DB Net
              const scale = 100/w.reduce((s,v)=>s+v,0);
              return w.map(v=>`<col style="width:${(v*scale).toFixed(2)}%">`).join('');
            })()}</colgroup>
            <thead>
              <tr>
                <th colspan="2" style="text-align:center;background:var(--navy);color:rgba(255,255,255,.7)">Year</th>
                ${isStandalone?'':'<th colspan="2" style="text-align:center;background:rgba(100,20,20,.85);color:#fff">Comparator(s) \u2014 Net Distributions</th>'}
                <th colspan="3" style="text-align:center;background:rgba(140,100,20,.9);color:#fff;border-left:2px solid rgba(201,168,76,.6)">EP Tax-Free Income</th>
                <th colspan="3" style="text-align:center;background:var(--navy);color:rgba(255,255,255,.7);border-left:2px solid rgba(255,255,255,.15)">EP Balance Summary (Median)</th>
                ${showDB?'<th colspan="3" style="text-align:center;background:rgba(42,110,69,.85);color:#fff;border-left:2px solid rgba(139,101,20,.5)">Death Benefit Focused \u2014 Stated Gross Rate, No Income Drawn</th>':''}
              </tr>
              <tr>
                <th>Yr</th><th>Age</th>
                ${isStandalone?'':`
                <th style="background:rgba(100,20,20,.7);color:#fff">${col3Label}</th>
                <th style="background:rgba(100,20,20,.5);color:#fff">${col4Label}</th>`}
                <th class="gold-col" style="border-left:2px solid rgba(201,168,76,.4)">25th</th>
                <th style="background:rgba(140,100,20,.7);color:#fff">50th \u2605</th>
                <th class="gold-col">75th</th>
                <th style="border-left:2px solid rgba(255,255,255,.15)">Asset Value</th>
                <th>Loan Balance</th>
                <th>Net Asset Value</th>
                ${showDB?`
                <th style="border-left:2px solid rgba(139,101,20,.3)">Gross AV</th>
                <th>CSV Net of Loans</th>
                <th>DB Net of Loans</th>`:''}
              </tr>
            </thead>
            <tbody>${rows}</tbody>
            <tfoot>${foot}</tfoot>
          </table>
        </div>
        <div class="disc-3col">
          <div>Hypothetical models assume crediting methods and charges that do not represent any particular investment or product. Returns shown are bootstrapped historical S&amp;P 500 sequences (${d.dataYears}-yr pool). Values are not guaranteed.${showDB?' Death Benefit Focused columns use the carrier\u2019s own stated (non-Monte Carlo) illustrated values, assuming no income is ever drawn. EFS projects the bank loan through Policy Year '+(d.refiYear-1)+'; from Policy Year '+d.refiYear+' (refinance) forward, the loan lives on the policy and the carrier\u2019s uploaded figures are used as-is, already net of that policy loan.':''}</div>
          <div>EFS Life LLC is not providing investment advice. The EP structure shown is hypothetical. Income reflects median (50th percentile) and scenario bands across ${d.nSims.toLocaleString()} simulations.</div>
          <div>THIS IS A HYPOTHETICAL MODEL. Refer to the full illustration for details, charges, and guarantees. EnhancedPension.com \u00b7 EFS Life LLC${d.advisor?' \u00b7 '+d.advisor:''} \u00b7 ${dateStr}${showDB?' \u00b7 Death benefit figures not valid without a complete carrier illustration.':''}</div>
        </div>`;
    }

    // ══════════════════════════════════════════════════════════
    // ASSEMBLE PAGES
    // ══════════════════════════════════════════════════════════
    let pagesHTML = '';
    if (isStandalone && dbByYear) {
      pagesHTML += `<div class="page">${buildEPvsDBPage()}</div>`;
    } else if (isStandalone) {
      pagesHTML += `<div class="page">${buildStandaloneIncomePage()}</div>`;
    } else if (showQP) {
      pagesHTML += `<div class="page">${buildGreensheetPage('Qualified Plan', d.qpRows50, epRows50, 'Enhanced Pension \u2014 EP \u00b7 Median Market Sequence \u00b7 vs. Qualified Plan', 'qp')}</div>`;
      pagesHTML += `<div class="page">${buildGreensheetPage('Taxable Investment Account', d.investRows50, epRows50, 'Enhanced Pension \u2014 EP \u00b7 Median Market Sequence \u00b7 vs. Taxable Investment Account', 'invest')}</div>`;
    } else {
      pagesHTML += `<div class="page">${buildGreensheetPage('Taxable Investment Account', d.investRows50, epRows50, 'Enhanced Pension \u2014 EP \u00b7 Median Market Sequence \u00b7 vs. Taxable Investment Account', 'invest')}</div>`;
    }
    pagesHTML += `<div class="page">${buildScenarioAnalysisPage()}</div>`;
    if (!isStandalone) {
      // In standalone mode, buildStandaloneIncomePage / buildEPvsDBPage already
      // show every year at full granularity (not just 5-year tranches) — this
      // page would just be a redundant, coarser summary of the same numbers.
      // It stays for comparator mode, where it's the only place showing all
      // three income percentiles alongside the comparator, year by year.
      pagesHTML += `<div class="page">${buildScenarioLedgerPage()}</div>`;
    }

    document.getElementById('pages').innerHTML = pagesHTML;

  } catch(e) {
    document.getElementById('pages').innerHTML = '<div style="padding:60px;font-family:monospace;color:red">Error building ledger: '+e.message+'<br><pre>'+e.stack+'</pre></div>';
    console.error(e);
  }
}
renderLedger();

// ══════════════════════════════════════════════════════════
// DEATH-BENEFIT TOGGLE / UPLOAD — wiring
// ══════════════════════════════════════════════════════════
function onDBToggle(){
  _dbEnabled = document.getElementById('dbToggle').checked;
  document.getElementById('dbFileLabel').classList.toggle('disabled', !_dbEnabled);
  document.getElementById('dbRateInput').classList.toggle('disabled', !_dbEnabled);
  document.getElementById('dbRateInput').disabled = !_dbEnabled;
  const status = document.getElementById('dbStatus');
  if (_dbEnabled && !_dbCarrierRows){
    status.textContent = 'Upload the death-benefit-focused carrier illustration to enable this output.';
    status.classList.remove('err');
  } else if (!_dbEnabled){
    status.textContent = '';
  }
  renderLedger();
}
function onDBRateInput(){
  _dbAssumedRate = document.getElementById('dbRateInput').value.trim();
  renderLedger();
}
async function onDBFileChosen(evt){
  const file = evt.target.files && evt.target.files[0];
  if (!file) return;
  const status = document.getElementById('dbStatus');
  const label = document.getElementById('dbFileLabel');
  status.classList.remove('err');
  status.textContent = 'Reading ' + file.name + '\u2026';
  try {
    const rows = await parseDBCarrierFile(file);
    _dbCarrierRows = rows;
    label.classList.add('has-file');
    label.textContent = '\u2713 ' + file.name;
    status.textContent = rows.length + ' years parsed \u2014 Accumulated Value, CSV, and Death Benefit found.';
    if (!_dbEnabled){
      document.getElementById('dbToggle').checked = true;
      _dbEnabled = true;
      label.classList.remove('disabled');
    }
    document.getElementById('dbRateInput').classList.remove('disabled');
    document.getElementById('dbRateInput').disabled = false;
    renderLedger();
  } catch(e){
    _dbCarrierRows = null;
    status.classList.add('err');
    status.textContent = 'Could not read file: ' + e.message;
    console.error(e);
  }
}
</script>
</body>
</html>
